plugins {
    id 'com.android.application'
}
android {
    namespace 'com.cari.ambalajlar'
    compileSdk 35
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    defaultConfig {
        applicationId "com.cari.ambalajlar"
        minSdk 23
        targetSdk 34
        versionCode 10
        versionName "1.1.8"
    }
}
dependencies {
    // AndroidX / CameraX libraries transitively pull different Kotlin stdlib versions.
    // Align stdlib and legacy jdk7/jdk8 artifacts to avoid duplicate classes in APK builds.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
}
