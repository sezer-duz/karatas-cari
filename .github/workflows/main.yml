name: Karatas Cari Android - APK Derleme

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-apk:
    name: Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Kaynak kodlarini indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Android 35 platformunu kur
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.7 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Android kaynak yapisini kontrol et
        run: python3 tools/verify_structure.py

      - name: Gradle surumunu goster
        run: gradle --version

      - name: Debug APK olustur
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Olusturulan APK dosyasini yukle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: karatas-cari-android-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Hata raporlarini sakla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-derleme-hata-raporlari
          path: |
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore
