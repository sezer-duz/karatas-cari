name: Karatas Cari Android - APK Derleme

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    name: Android Debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    # Firebase Android client configuration is supplied as GitHub Actions secrets.
    # Empty values allow a build but notifications stay disabled until configured.
    env:
      FCM_APP_ID: ${{ secrets.FCM_APP_ID }}
      FCM_API_KEY: ${{ secrets.FCM_API_KEY }}
      FCM_PROJECT_ID: ${{ secrets.FCM_PROJECT_ID }}
      FCM_SENDER_ID: ${{ secrets.FCM_SENDER_ID }}

    steps:
      - name: Kaynak kodlarini indir
        uses: actions/checkout@v4

      - name: Android proje dosyalarini dogrula
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f tools/verify_structure.py ] || [ ! -f app/build.gradle ]; then
            echo '::error::app/ ve tools/ klasorleri GitHub depo kokunde eksik. Tam kaynak ZIP dosyasini ACIP icindeki klasorleri depoya yukleyin.'
            ls -la
            exit 1
          fi
          python3 tools/verify_structure.py

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Ubuntu runner'inda zaten kurulu olan Android SDK kullanilir.
      # Hata veren otomatik SDK kurulum eylemi yerine kurulu SDK kullanilir.
      - name: Android SDK yolunu kontrol et
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "::error::Android SDK klasoru bulunamadi: $SDK_ROOT"
            exit 1
          fi
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "SDK root: $SDK_ROOT"

      - name: Android 35 SDK platformunu hazirla
        shell: bash
        run: |
          set -euo pipefail
          PLATFORM="$ANDROID_SDK_ROOT/platforms/android-35/android.jar"
          AAPT="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt2"
          if [ -f "$PLATFORM" ] && [ -x "$AAPT" ]; then
            echo 'Android platform 35 ve build-tools 35.0.0 mevcut; indirme gerekmiyor.'
          else
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
            if [ ! -x "$SDKMANAGER" ]; then
              echo "::error::Android SDK cmdline-tools bulunamadi: $SDKMANAGER"
              exit 1
            fi
            mkdir -p "$HOME/.android"
            touch "$HOME/.android/repositories.cfg"
            # yes komutu normalde SIGPIPE ile sonlanabilir: sdkmanager cikis kodunu kontrol ediyoruz.
            if ! (set +o pipefail; yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses > /tmp/sdk-licenses.log 2>&1); then
              tail -n 60 /tmp/sdk-licenses.log
              echo '::error::Android SDK lisanslari onaylanamadi.'
              exit 1
            fi
            "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --install 'platforms;android-35' 'build-tools;35.0.0'
          fi
          test -f "$PLATFORM" || { echo '::error::Android 35 platformu eksik'; exit 1; }
          test -x "$AAPT" || { echo '::error::Android 35 aapt2 eksik'; exit 1; }

      - name: Gradle 8.7 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Debug APK olustur ve tum Gradle logunu kaydet
        shell: bash
        run: |
          mkdir -p build/diagnostics
          set +e
          gradle --no-daemon --console=plain --stacktrace :app:assembleDebug 2>&1 | tee build/diagnostics/gradle-build.log
          build_status=${PIPESTATUS[0]}
          set -e
          if [ "$build_status" -ne 0 ]; then
            python3 tools/extract_gradle_error.py build/diagnostics/gradle-build.log > build/diagnostics/error-summary.txt
            cat build/diagnostics/error-summary.txt
            {
              echo '### APK derlemesi basarisiz'
              echo 'Hata raporunu **Artifacts → android-derleme-hata-raporlari** bölümünden indirip **gradle-build.log** dosyasini paylasin.'
              echo '```text'
              cat build/diagnostics/error-summary.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo '::error::Gradle derlemesi basarisiz. Tam log build/diagnostics/gradle-build.log dosyasina kaydedildi.'
            exit "$build_status"
          fi

      - name: APK dosyasini yayimla
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: karatas-cari-android-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Derleme raporlarini sakla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-derleme-hata-raporlari
          path: |
            build/diagnostics/gradle-build.log
            build/diagnostics/error-summary.txt
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: warn
          retention-days: 14
